<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت آرتام حمیدی</title>
    <style>
        /* ===== فونت و استایل‌های پایه ===== */
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #07070d;
            color: #d0d0d0;
            padding: 30px 20px;
            max-width: 850px;
            margin: 0 auto;
            line-height: 1.8;
        }

        h1 {
            color: #00e676;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 900;
            font-size: 2rem;
            border-bottom: 2px solid #7c5cfc;
            padding-bottom: 15px;
        }

        /* ===== کارت‌های پیام ===== */
        .card {
            background: #0f0f1a;
            border: 1px solid #7c5cfc;
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(124, 92, 252, 0.1);
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: #00e676;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #888;
            font-size: 0.88rem;
            border-bottom: 1px solid #1a1a2e;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .user-info {
            color: #7c5cfc;
            font-weight: bold;
        }

        .msg-text {
            font-size: 1rem;
            color: #fff;
            margin-bottom: 15px;
            white-space: pre-line;
            background: #07070d;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #1a1a2e;
        }

        /* ===== کادر پاسخ ===== */
        textarea {
            width: 100%;
            padding: 12px;
            background: #000;
            color: #00e676;
            border: 1px solid #333;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            margin-bottom: 12px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #00e676;
        }

        /* ===== دکمه‌ها ===== */
        .btns-group {
            display: flex;
            gap: 12px;
        }

        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .btn-save {
            background: #00e676;
            color: #000;
        }

        .btn-save:hover {
            background: #00c853;
        }

        .btn-delete {
            background: #ff4444;
            color: #fff;
        }

        .btn-delete:hover {
            background: #cc0000;
        }

        .status-msg {
            text-align: center;
            color: #888;
            font-size: 1.1rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <h1>🔐 پنل مدیریت پیام‌ها و تیکت‌های آرتام</h1>
    <div id="adminContainer" class="status-msg">درحال ورود به دیتابیس...</div>

    <script>
        // آدرس دیتابیس دقیقاً مشابه فایل index.html
        const DB_URL = "https://kvdb.io/2Udt8vG1uA4g5sM8E3aJ7W/artam_tickets_v105";
        const PROXY = "https://api.codetabs.com/v1/proxy?quest=";
        const ADMIN_PASS = "123123آرتام آر آر آر آرت";

        // بررسی رمز عبور هنگام ورود به صفحه
        window.onload = function() {
            let pass = prompt("رمز عبور مدیر را وارد کنید:");
            if (pass !== ADMIN_PASS) {
                alert("❌ رمز عبور اشتباه است!");
                document.body.innerHTML = "<h2 style='color:red; text-align:center; margin-top:50px;'>دسترسی مسدود شد!</h2>";
            } else {
                loadAdminTickets();
            }
        };

        // بارگذاری تمام تیکت‌ها از سرور ابری
        async function loadAdminTickets() {
            let container = document.getElementById('adminContainer');
            container.innerHTML = "درحال عبور از فیلترینگ و بارگذاری پیام‌ها...";

            try {
                let res = await fetch(PROXY + encodeURIComponent(DB_URL));
                if (!res.ok) {
                    container.innerHTML = "<p class='status-msg'>پیامی در دیتابیس یافت نشد.</p>";
                    return;
                }

                let text = await res.text();
                let tickets = [];
                try {
                    tickets = JSON.parse(text);
                } catch (e) {
                    tickets = [];
                }

                if (!Array.isArray(tickets) || tickets.length === 0) {
                    container.innerHTML = "<p class='status-msg'>هیچ پیامی برای مدیریت وجود ندارد.</p>";
                    return;
                }

                container.innerHTML = "";
                tickets.forEach((item, index) => {
                    container.innerHTML += `
                        <div class="card">
                            <div class="card-header">
                                <span class="user-info">👤 ${item.name || 'ناشناس'} (${item.type || 'پیام'})</span>
                                <span>📅 ${item.date || ''}</span>
                            </div>
                            <div class="msg-text">📝 ${item.msg}</div>
                            
                            <label style="font-size:0.85rem; color:#888; display:block; margin-bottom:5px;">پاسخ شما به کاربر:</label>
                            <textarea id="reply-${index}" rows="3" placeholder="پاسخ خود را اینجا بنویسید...">${item.reply || ''}</textarea>
                            
                            <div class="btns-group">
                                <button class="btn-save" onclick="saveReply(${index})">💾 ثبت / ویرایش پاسخ</button>
                                <button class="btn-delete" onclick="deleteTicket(${index})">🗑️ حذف این پیام</button>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                container.innerHTML = "<p style='color:red;' class='status-msg'>خطا در بارگذاری پیام‌ها. لطفاً صفحه را رفرش کنید.</p>";
            }
        }

        // ذخیره پاسخ مدیر برای یک تیکت مشخص
        async function saveReply(index) {
            let replyText = document.getElementById(`reply-${index}`).value;
            let container = document.getElementById('adminContainer');

            try {
                let res = await fetch(PROXY + encodeURIComponent(DB_URL));
                let text = await res.text();
                let tickets = JSON.parse(text);

                // به روزرسانی پاسخ پیام انتخاب شده
                tickets[index].reply = replyText;

                // ذخیره مجدد تمام تیکت‌ها روی دیتابیس ابری
                await fetch(PROXY + encodeURIComponent(DB_URL), {
                    method: 'POST',
                    body: JSON.stringify(tickets)
                });

                alert("✅ پاسخ شما با موفقیت ثبت شد و در سایت قرار گرفت!");
                loadAdminTickets();
            } catch (e) {
                alert("❌ خطا در ذخیره پاسخ! اتصال شبکه را چک کنید.");
            }
        }

        // حذف یک پیام از دیتابیس
        async function deleteTicket(index) {
            if (!confirm("آیا از حذف این پیام اطمینان دارید؟")) return;

            try {
                let res = await fetch(PROXY + encodeURIComponent(DB_URL));
                let text = await res.text();
                let tickets = JSON.parse(text);

                // حذف پیام مربوطه از آرایه
                tickets.splice(index, 1);

                // ذخیره مجدد لیست آپدیت شده
                await fetch(PROXY + encodeURIComponent(DB_URL), {
                    method: 'POST',
                    body: JSON.stringify(tickets)
                });

                alert("🗑️ پیام با موفقیت حذف شد!");
                loadAdminTickets();
            } catch (e) {
                alert("❌ خطا در حذف پیام!");
            }
        }
    </script>
</body>
</html>
