<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آرتام حمیدی | مرکز خبر و آپدیت</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #050508;
            --card: #111118;
            --primary: #8b5cf6;
            --accent: #06b6d4;
            --text: #e2e8f0;
            --muted: #71717a;
            --border: rgba(255, 255, 255, 0.06);
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.8;
            background-image: radial-gradient(circle at 50% -20%, #1e1b4b, transparent 50%);
        }

        /* هدر */
        header {
            padding: 60px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            background: rgba(5, 5, 8, 0.6);
            backdrop-filter: blur(15px);
            position: sticky; top: 0; z-index: 100;
        }

        header h1 { font-size: 2.2rem; font-weight: 900; background: linear-gradient(to bottom, #fff, #666); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { color: var(--accent); font-weight: bold; font-size: 0.9rem; margin-top: 5px; letter-spacing: 1px; }

        main { max-width: 800px; margin: 40px auto; padding: 0 20px; }

        /* کارت خبر */
        .news-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 35px;
            margin-bottom: 30px;
            transition: 0.3s;
        }

        .news-card:hover { border-color: var(--primary); box-shadow: 0 10px 40px rgba(139, 92, 246, 0.1); }

        .news-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .news-title { font-size: 1.4rem; font-weight: 800; color: #fff; }
        .news-date { color: var(--accent); font-size: 0.85rem; font-weight: bold; background: rgba(6, 182, 212, 0.1); padding: 4px 12px; border-radius: 10px; }

        .news-body { color: #a1a1aa; font-size: 1.05rem; white-space: pre-line; margin-bottom: 20px; }

        /* مدیا */
        .media-img { width: 100%; border-radius: 16px; margin-top: 15px; border: 1px solid var(--border); cursor: zoom-in; }
        .media-vid { width: 100%; border-radius: 16px; margin-top: 15px; background: #000; outline: none; }

        .btn-apk {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: #fff; color: #000; width: 100%; padding: 15px;
            border-radius: 14px; font-weight: 900; font-size: 1.1rem;
            margin-top: 25px; text-decoration: none; transition: 0.3s;
        }
        .btn-apk:hover { background: var(--primary); color: #fff; transform: translateY(-2px); }

        /* پنل تولید کد برای ادمین */
        .admin-trigger { position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px; background: var(--primary); border: none; border-radius: 50%; cursor: pointer; font-size: 1.5rem; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .admin-panel { display: none; background: #18181b; border: 1px solid var(--primary); padding: 30px; border-radius: 24px; margin-bottom: 40px; }
        .admin-panel input, .admin-panel textarea { width: 100%; background: #09090b; border: 1px solid var(--border); color: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; font-family: inherit; }
        
        .code-output { background: #000; color: #00e676; padding: 20px; border-radius: 12px; font-family: monospace; font-size: 0.85rem; margin-top: 20px; white-space: pre-wrap; display: none; border: 1px solid #333; position: relative; }
        .copy-notice { color: #ffaa00; font-size: 0.8rem; margin-top: 10px; display: none; }

        /* لایت باکس */
        .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 90%; max-height: 90%; border-radius: 12px; }

        footer { text-align: center; padding: 50px; color: var(--muted); font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <h1>آرتام حمیدی</h1>
        <p>CENTER OF THE ADVENTURE WORLD</p>
    </header>

    <main>
        <!-- پنل ادمین (تولیدکننده کد) -->
        <div class="admin-panel" id="adminPanel">
            <h2 style="margin-bottom:20px; color:var(--primary);">ساخت خبر جدید (دستیار ادمین)</h2>
            <input type="text" id="pTitle" placeholder="عنوان خبر">
            <textarea id="pText" rows="4" placeholder="متن کامل خبر..."></textarea>
            <input type="text" id="pImg" placeholder="لینک عکس (پیکوفایل یا گیت‌هاب)">
            <input type="text" id="pVid" placeholder="لینک ویدیو (پیکوفایل یا گیت‌هاب)">
            <input type="text" id="pApk" placeholder="لینک APK (پیش‌فرض: app-debug.apk)" value="app-debug.apk">
            
            <button class="btn-apk" style="background:var(--primary); color:#fff;" onclick="generateCode()">✨ تولید کد برای گیت‌هاب</button>
            
            <div class="code-output" id="codeOutput"></div>
            <p class="copy-notice" id="copyNotice">⚠️ این کد را کپی کنید و در فایل news.json گیت‌هاب جایگزین کل محتویات قبلی کنید.</p>
        </div>

        <!-- فید اخبار -->
        <div id="newsFeed">در حال لود اخبار از سرور گیت‌هاب...</div>
    </main>

    <button class="admin-trigger" onclick="toggleAdmin()">🔒</button>

    <div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
        <img id="lbImg" src="">
    </div>

    <footer>DEVELOPED BY ARTAM HAMIDI | 2025</footer>

    <script>
        // آدرس مستقیم فایل در گیت‌هاب خودت (نام کاربری را چک کن)
        const JSON_FILE_URL = "news.json";

        function getShamsi() {
            return new Intl.DateTimeFormat('fa-IR-u-ca-persian', {year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
        }

        function toggleAdmin() {
            if(prompt("کد ادمین:") === "123123آرتام آر آر آر آرت") {
                document.getElementById('adminPanel').style.display = 'block';
            }
        }

        // --- بارگذاری اخبار (فوق‌العاده سریع و بدون پروکسی) ---
        async function loadFeed() {
            const container = document.getElementById('newsFeed');
            try {
                // اضافه کردن یک عدد رندوم به ته آدرس برای جلوگیری از لود شدن نسخه قدیمی (Cache)
                const response = await fetch(JSON_FILE_URL + "?v=" + Date.now());
                const feed = await response.json();

                if (feed.length === 0) {
                    container.innerHTML = `<div class="news-card"><h3 class="news-title">🚀 خوش آمدید</h3><p class="news-body">هنوز خبری منتشر نشده است.</p></div>`;
                    return;
                }

                container.innerHTML = "";
                feed.forEach(item => {
                    let imgHTML = item.img ? `<img src="${item.img}" class="media-img" onclick="openLightbox(this.src)">` : '';
                    let vidHTML = item.vid ? `<video class="media-vid" controls preload="metadata"><source src="${item.vid}"></video>` : '';
                    let apkHTML = item.apk ? `<a href="${item.apk}" class="btn-apk" download>📥 دانلود فایل APK بازی</a>` : '';

                    container.innerHTML += `
                        <div class="news-card">
                            <div class="news-header">
                                <h3 class="news-title">${item.title}</h3>
                                <span class="news-date">${item.date}</span>
                            </div>
                            <div class="news-body">${item.text}</div>
                            ${imgHTML}
                            ${vidHTML}
                            ${apkHTML}
                        </div>`;
                });
            } catch (e) {
                container.innerHTML = `<p style="color:red; text-align:center;">خطا در خواندن فایل news.json. مطمئن شوید این فایل را در گیت‌هاب ساخته‌اید.</p>`;
            }
        }

        // --- تولید کد برای آپدیت دستی ---
        async function generateCode() {
            const title = document.getElementById('pTitle').value;
            const text = document.getElementById('pText').value;
            const img = document.getElementById('pImg').value;
            const vid = document.getElementById('pVid').value;
            const apk = document.getElementById('pApk').value;

            if(!title || !text) return alert("عنوان و متن الزامی است!");

            // گرفتن لیست فعلی برای اضافه کردن به ابتدای آن
            let currentFeed = [];
            try {
                const res = await fetch(JSON_FILE_URL + "?v=" + Date.now());
                currentFeed = await res.json();
            } catch(e) {}

            const newPost = { title, text, img, vid, apk, date: getShamsi() };
            currentFeed.unshift(newPost);

            const output = document.getElementById('codeOutput');
            output.innerText = JSON.stringify(currentFeed, null, 2);
            output.style.display = 'block';
            document.getElementById('copyNotice').style.display = 'block';
            
            alert("کد جدید تولید شد! آن را کپی کنید و در فایل news.json گیت‌هاب Paste کنید.");
        }

        function openLightbox(s) { document.getElementById('lbImg').src = s; document.getElementById('lightbox').classList.add('active'); }
        
        window.onload = loadFeed;
    </script>
</body>
</html>
